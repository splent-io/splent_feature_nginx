services:
  splent_feature_nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: splent/splent_feature_nginx:latest
    restart: always
    ports:
      - "${NGINX_HTTP_HOST_PORT}:80"
      - "${NGINX_HTTPS_HOST_PORT}:443"
    # Location snippets are contributed by dropping *.conf files in the
    # directory below, which product:build copies into the deploy artifact
    # as <product>/docker/features/splent_feature_nginx/nginx/locations/.
    # A compose fragment from another feature cannot do this, because
    # product:up runs each feature compose as its own project and
    # merge_compose replaces same-named services wholesale.
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ${NGINX_FEATURE_HOST_DIR}/docker/nginx/locations:/etc/nginx/conf.d/locations:ro
    environment:
      - NGINX_UPSTREAM_HOST=${NGINX_UPSTREAM_HOST}
      - NGINX_UPSTREAM_PORT=${NGINX_UPSTREAM_PORT}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
      # Empty means no peer may assert X-Forwarded-* headers. Fill it in
      # only when a TLS terminator on the host fronts this container.
      - NGINX_TRUSTED_PROXY_CIDRS=${NGINX_TRUSTED_PROXY_CIDRS:-}
    networks:
      - splent_network

volumes:
  letsencrypt:
  certbot_webroot:

networks:
  splent_network:
    external: true

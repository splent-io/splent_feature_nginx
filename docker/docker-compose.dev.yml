services:
  splent_feature_nginx:
    image: nginx:1.27
    restart: always
    ports:
      - "${NGINX_HTTP_HOST_PORT}:80"
    volumes:
      - ${NGINX_FEATURE_HOST_DIR}/docker/nginx/templates/default.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - NGINX_UPSTREAM_HOST=${NGINX_UPSTREAM_HOST}
      - NGINX_UPSTREAM_PORT=${NGINX_UPSTREAM_PORT}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    networks:
      - splent_network

networks:
  splent_network:
    external: true
